name: GetCraft
description: GetCraft is a Southeast Asian creative and content-marketing marketplace, headquartered
  in Indonesia and backed by 500 Global, that brands itself as "The Creative Industry's Premium
  Directory." It connects brands and agencies with a vetted network of freelance creators and
  production partners ("Crafters") for content, video, design, advertising, and marketing work,
  spanning a talent Directory, a Jobs board, Managed project services, and a Community. Its
  companion publication, MarketingCraft, is a bilingual (English/Indonesian) content hub of
  articles, events, tutorials, jobs, and research for marketers and creators. GetCraft exposes no
  public developer or API surface; this record is an identity/enrichment profile.
