name: GetCraft Security Policy
summary: >-
  GetCraft publishes its internal information-security policy set publicly, as a
  GitBook-backed repository on its own GitHub organization. Fifteen documents cover data
  protection, encryption, acceptable use, data breach response, data classification,
  disaster recovery, email, passwords, security response planning, remote access, and
  server/database security. The content is derived from the SANS policy templates and
  describes GetCraft's own controls; it is an internal-controls policy set, NOT an
  external vulnerability-disclosure program.
ownership_check: >-
  The GitHub organization github.com/GetCraft declares blog "getcraft.com" and location
  "South East Asia", matching this company; the repository is named "GetCraft's Security
  Policy" and every document names GetCraft as the policy owner. Not a fork.
