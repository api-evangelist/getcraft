external_disclosure_channel: false
external_disclosure_note: >-
  No researcher-facing reporting channel is published anywhere in the policy set — no
  security contact address, no responsible-disclosure page, no bug bounty, and no
  /.well-known/security.txt (that path returns 502 along with the rest of the estate).
  Section 6 "Reporting Requirements" and the Security Response Plan Policy both address
  internal escalation to GetCraft's DevSecOps team only. Do not read this artifact as a
  vulnerability disclosure program.
staleness_note: >-
  Last commit 2020-10-05; the policy set has not been revised in almost six years, and
  the company's production estate has been returning HTTP 502 since at least 2026-07-19.
